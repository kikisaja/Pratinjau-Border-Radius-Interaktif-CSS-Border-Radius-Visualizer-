<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Border-Radius Visualizer 🎨</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-card">
        <!-- Header -->
        <header class="app-header">
            <span class="badge">Saran No. 92</span>
            <h1>🎨 BORDER RADIUS STUDIO</h1>
            <p>Geser slider untuk mengubah kelengkungan sudut box!</p>
        </header>

        <!-- Area Preview Box -->
        <div class="preview-section">
            <div id="preview-box" class="box"></div>
        </div>

        <!-- Area Kontrol Slider -->
        <div class="controls-section">
            <div class="slider-group pink">
                <label>Kiri Atas (Top-Left): <span id="val-tl">0px</span></label>
                <input type="range" id="slider-tl" min="0" max="200" value="0">
            </div>
            
            <div class="slider-group blue">
                <label>Kanan Atas (Top-Right): <span id="val-tr">0px</span></label>
                <input type="range" id="slider-tr" min="0" max="200" value="0">
            </div>

            <div class="slider-group yellow">
                <label>Kanan Bawah (Bottom-Right): <span id="val-br">0px</span></label>
                <input type="range" id="slider-br" min="0" max="200" value="0">
            </div>

            <div class="slider-group green">
                <label>Kiri Bawah (Bottom-Left): <span id="val-bl">0px</span></label>
                <input type="range" id="slider-bl" min="0" max="200" value="0">
            </div>
        </div>

        <!-- Area Hasil Output CSS -->
        <div class="output-section">
            <div class="code-box">
                <code id="css-code">border-radius: 0px 0px 0px 0px;</code>
            </div>
            <button id="btn-copy" class="btn btn-primary">📋 COPY CSS</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
